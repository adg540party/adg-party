<!DOCTYPE html>
<html lang="ru" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Занятия и кружки — АдГ</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        adg: {
                            green: '#008751',
                            greenDark: '#005c36',
                            greenLight: '#e6f4ed',
                            red: '#e53935',
                            redhover: '#c62828',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased flex flex-col min-h-screen">

    <!-- Header -->
    <header class="sticky top-0 z-50 bg-white border-b border-slate-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
             <a href="index.html" class="flex items-center">
    <img src="logo.jpg" alt="АдГ Логотип" class="h-10 w-auto">
                <div class="hidden sm:flex flex-col border-l border-slate-200 pl-3">
                    <span class="text-xs font-bold uppercase tracking-wider text-slate-500">Партия</span>
                    <span class="text-xs font-extrabold text-adg-green tracking-wide uppercase">Альтернатива для Гимназии</span>
                </div>
            </a>
            
            <nav class="hidden md:flex items-center gap-8 font-medium text-sm text-slate-600">
                <a href="index.html#about" class="hover:text-adg-green transition-colors">О нас</a>
                <a href="index.html#ideas" class="hover:text-adg-green transition-colors">Идеи и Парламент</a>
                <a href="classes.html" class="text-adg-green font-bold">Занятия</a>
                <a href="index.html#bot" class="hover:text-adg-green transition-colors">Приемная & Опросник</a>
                <a href="index.html#groups" class="hover:text-adg-green transition-colors">Инициативная группа</a>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-6xl mx-auto px-4 py-12 flex-grow">
        <h1 class="text-4xl sm:text-5xl lg:text-6xl font-black text-slate-900 tracking-tight leading-none mb-6">Занятия и кружки</h1>
        <p class="text-slate-600 mb-12 text-lg">Выберите интересующее вас направление:</p>

        <!-- Кнопки фильтрации -->
        <div class="flex flex-wrap gap-3 mb-16">
            <button onclick="filterCategory('all')" class="filter-btn bg-adg-green text-white px-6 py-2.5 rounded-xl text-sm font-semibold shadow-sm transition-all" data-filter="all">Все</button>
            <button onclick="filterCategory('sport')" class="filter-btn bg-white text-slate-600 px-6 py-2.5 rounded-xl text-sm font-semibold border border-slate-200 hover:bg-slate-100 transition-all" data-filter="sport">Спорт</button>
            <button onclick="filterCategory('programming')" class="filter-btn bg-white text-slate-600 px-6 py-2.5 rounded-xl text-sm font-semibold border border-slate-200 hover:bg-slate-100 transition-all" data-filter="programming">Программирование</button>
            <button onclick="filterCategory('acting')" class="filter-btn bg-white text-slate-600 px-6 py-2.5 rounded-xl text-sm font-semibold border border-slate-200 hover:bg-slate-100 transition-all" data-filter="acting">Актёрское мастерство</button>
            <button onclick="filterCategory('creativity')" class="filter-btn bg-white text-slate-600 px-6 py-2.5 rounded-xl text-sm font-semibold border border-slate-200 hover:bg-slate-100 transition-all" data-filter="creativity">Творчество</button>
        </div>

        <!-- Контент: Просто текст «Занятий пока нет» с поддержкой фильтров -->
        <div id="no-classes-message" class="text-center py-20">
            <p class="text-2xl sm:text-3xl font-semibold text-slate-400">Занятий пока нет</p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-6 text-center text-sm text-slate-500">
        <p>&copy; 2026 АдГ. Все права защищены.</p>
    </footer>

    <script>
        function filterCategory(category) {
            // Подсветка активной кнопки
            const buttons = document.querySelectorAll('.filter-btn');
            buttons.forEach(btn => {
                if (btn.getAttribute('data-filter') === category) {
                    btn.className = "filter-btn bg-adg-green text-white px-6 py-2.5 rounded-xl text-sm font-semibold shadow-sm transition-all";
                } else {
                    btn.className = "filter-btn bg-white text-slate-600 px-6 py-2.5 rounded-xl text-sm font-semibold border border-slate-200 hover:bg-slate-100 transition-all";
                }
            });
        }
    </script>
</body>
</html>
